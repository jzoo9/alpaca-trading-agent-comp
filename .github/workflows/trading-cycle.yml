name: Trading cycle

# Runs the agent completely independent of any laptop being on. Each firing
# is a single --mode run-once cycle (connect, screen, decide, exit) -- no
# long-running daemon needed on GitHub's ephemeral runners.
#
# Cron is UTC and does NOT auto-adjust for US daylight saving time. This
# schedule (13:00-19:59 UTC) targets 9:00am-3:59pm ET during EDT (UTC-4,
# roughly mid-March to early November). Once DST ends (~early November,
# switching to EST/UTC-5), shift both hour bounds by +1 (14-20) or the
# window will start an hour early / end an hour early relative to the real
# market open/close. The agent's own market-clock check (cycle.py) is the
# real safety net either way -- a firing outside real market hours just
# does nothing (fast, cheap no-op), it never trades off-hours by mistake.
"on":
  schedule:
    - cron: "*/15 13-19 * * 1-5"
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab for testing

permissions:
  contents: read

concurrency:
  group: trading-cycle
  cancel-in-progress: false # never cancel a cycle mid-flight (could be mid-order-submission)

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Run unit tests (safety gate -- do not trade on a broken build)
        run: pytest tests/ -q

      # The SQLite ledger (data/agent.db) is state the code reads from every
      # cycle -- it's how the risk gates know what's currently open. GitHub
      # Actions runners are ephemeral (a blank filesystem every run), so this
      # restores whatever the last run saved. Uses a per-run unique save key
      # with a shared restore-keys prefix, since GH's cache backend doesn't
      # support overwriting an existing key -- this is the standard idiom for
      # "mutable" state via actions/cache.
      - name: Restore ledger state
        uses: actions/cache/restore@v4
        with:
          path: data
          key: ledger-db-${{ github.run_id }}
          restore-keys: |
            ledger-db-

      - name: Run one trading cycle
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER_TRADE: "true"
          FEATHERLESS_API_KEY: ${{ secrets.FEATHERLESS_API_KEY }}
          FEATHERLESS_MODEL: moonshotai/Kimi-K2-Instruct
        run: python -m alpaca_quant_agent.main --mode run-once --log-level INFO

      # Always save, even if the cycle step above failed partway through --
      # whatever ledger writes happened (e.g. a logged decision before a
      # later error) should still persist for the next run to build on.
      - name: Save ledger state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: ledger-db-${{ github.run_id }}
